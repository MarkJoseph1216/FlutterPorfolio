<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mark Joseph — Mobile Developer Portfolio">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mark Joseph">
  <title>Mark Joseph — Mobile Developer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="canvaskit/canvaskit.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" crossorigin="anonymous">
  <style>
    * {
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0C0C0C;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .scrollable {
      transform: translateZ(0);
      will-change: scroll-position;
      backface-visibility: hidden;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0C0C0C;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #loader.hide {
      opacity: 0;
      pointer-events: none;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00FFFF;
      margin: 0 4px;
      animation: pulse 1s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1.2); }
    }

    body {
      overscroll-behavior: none;
    }

    canvas {
      will-change: transform;
      transform: translateZ(0);
    }
  </style>
</head>
<body>

<div id="loader">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<script>
  const ua = navigator.userAgent.toLowerCase();
  const isMobile = /iphone|ipad|ipod|android|windows phone|mobile/.test(ua) || navigator.maxTouchPoints > 1;
  const isSafari = /safari/.test(ua) && !/chrome|chromium|edg/.test(ua);
  const isLowEndDevice = /iphone [6-8]|ipad [4-6]|android [7-9]/.test(ua);

  window.flutterConfiguration = {
    renderer: 'canvaskit',
    canvasKitBaseUrl: '/canvaskit/',
    useSkwasm: !isLowEndDevice,
    preferWebgl: !isSafari,
  };

  document.addEventListener('DOMContentLoaded', function() {
    document.body.classList.add('scrollable');

    window.addEventListener('load', function() {
      setTimeout(function() {
        const loader = document.getElementById('loader');
        if (loader) {
          loader.classList.add('hide');
          setTimeout(function() {
            if (loader && loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 500);
        }
      }, 100);
    });
  });
</script>
<script src="flutter_bootstrap.js" defer></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for (let registration of registrations) {
        registration.unregister();
      }
    });
  }
</script>
</body>
</html>
